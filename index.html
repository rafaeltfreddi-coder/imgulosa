
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Galeria de Imagens</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <main>
    <h1>Minha Galeria de Imagens</h1>

    <div class="galeria">

      <button type="button" aria-label="Ampliar Água-viva colorida">
        <img src="imagens/img1.png" alt="Água-viva colorida">
        <span>Água-viva colorida</span>
      </button>

      <button type="button" aria-label="Ampliar Coala">
        <img src="imagens/img2.png" alt="Coala">
        <span>Coala</span>
      </button>

      <button type="button" aria-label="Ampliar Deserto">
        <img src="imagens/img3.png" alt="Deserto">
        <span>Deserto</span>
      </button>

      <button type="button" aria-label="Ampliar Flores no lago">
        <img src="imagens/img4.png" alt="Flores no lago">
        <span>Flores no lago</span>
      </button>

      <button type="button" aria-label="Ampliar Casas no lago">
        <img src="imagens/img5.png" alt="Casas no lago">
        <span>Casas no lago</span>
      </button>

      <button type="button" aria-label="Ampliar Rio na floresta">
        <img src="imagens/img6.png" alt="Rio na floresta">
        <span>Rio na floresta</span>
      </button>

      <button type="button" aria-label="Ampliar Montanhas">
        <img src="imagens/img7.png" alt="Montanhas">
        <span>Montanhas</span>
      </button>

      <button type="button" aria-label="Ampliar Pôr do sol">
        <img src="imagens/img8.png" alt="Pôr do sol">
        <span>Pôr do sol</span>
      </button>

    </div>
  </main>

  <dialog class="ampliacao" aria-label="Imagem ampliada">
    <button class="fechar" type="button" aria-label="Fechar">
      &times;
    </button>
    <img class="imagem-ampliada" alt="">
  </dialog>

  <script src="script.js"></script>

</body>
</html>
